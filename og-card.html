<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #f4f5f3;
    font-family: 'IBM Plex Sans', sans-serif;
    position: relative;
    overflow: hidden;
  }
  .grid-line { position: absolute; background: #e1e3e0; }
  .logo {
    position: absolute; top: 64px; left: 72px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600; font-size: 30px; color: #14171c; letter-spacing: -0.01em;
  }
  .logo .dot { color: #a5690f; }
  h1 {
    position: absolute; top: 168px; left: 72px; right: 72px;
    font-size: 64px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.08;
    color: #14171c; max-width: 980px;
  }
  h1 em { font-style: normal; color: #7a4e10; }
  .lede {
    position: absolute; top: 400px; left: 72px;
    font-size: 24px; color: #5b616b; max-width: 820px; line-height: 1.5;
  }
  .diffcard {
    position: absolute; top: 470px; left: 72px;
    display: flex; gap: 28px;
    font-family: 'IBM Plex Mono', monospace; font-size: 18px;
  }
  .diffcard .up { color: #1b7a4d; }
  .diffcard .down { color: #b0392c; }
</style>
</head>
<body>
  <div class="logo">ratelog<span class="dot">.</span></div>
  <h1>AI coding tool pricing<br/>&amp; limits <em>— tracked like a changelog.</em></h1>
  <p class="lede">8 tools, one ledger. Every price and quota change, dated and sourced.</p>
  <div class="diffcard">
    <span class="up">+ Claude Code Max 20x</span>
    <span class="down">&minus; Cursor Pro quota cut</span>
  </div>
</body>
</html>
